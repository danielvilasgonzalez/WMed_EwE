<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f3fb"/>
      <stop offset="1" stop-color="#bcdcf2"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="180" cy="180" r="160"/></clipPath>
  </defs>

  <!-- Emblem: a food web growing from stacked data blocks, in the sea -->
  <circle cx="180" cy="180" r="160" fill="url(#sea)"/>
  <g clip-path="url(#disc)">
    <!-- waves -->
    <path d="M10 250 C 60 232, 100 268, 150 250 S 240 232, 290 250 S 360 268, 380 250 L 380 360 L 10 360 Z" fill="#5aa0d8" opacity="0.55"/>
    <path d="M10 282 C 60 266, 100 298, 150 282 S 240 266, 290 282 S 360 298, 380 282 L 380 360 L 10 360 Z" fill="#0f4c81" opacity="0.85"/>
    <!-- data blocks: B, C, P/B-Q/B, Diet -->
    <g stroke="#ffffff" stroke-width="4">
      <rect x="92"  y="212" width="56" height="34" rx="6" fill="#0f4c81"/>
      <rect x="152" y="212" width="56" height="34" rx="6" fill="#2a6fb0"/>
      <rect x="212" y="212" width="56" height="34" rx="6" fill="#0f4c81"/>
      <rect x="122" y="174" width="56" height="34" rx="6" fill="#2a6fb0"/>
      <rect x="182" y="174" width="56" height="34" rx="6" fill="#5aa0d8"/>
    </g>
  </g>
  <!-- food web: links -->
  <g stroke="#0f4c81" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="180" y1="62"  x2="132" y2="104"/>
    <line x1="180" y1="62"  x2="228" y2="104"/>
    <line x1="132" y1="104" x2="112" y2="150"/>
    <line x1="132" y1="104" x2="180" y2="150"/>
    <line x1="228" y1="104" x2="180" y2="150"/>
    <line x1="228" y1="104" x2="248" y2="150"/>
    <line x1="112" y1="150" x2="150" y2="174"/>
    <line x1="180" y1="150" x2="180" y2="174"/>
    <line x1="248" y1="150" x2="210" y2="174"/>
  </g>
  <!-- food web: nodes (larger = higher trophic level) -->
  <g stroke="#ffffff" stroke-width="4">
    <circle cx="180" cy="62"  r="19" fill="#0f4c81"/>
    <circle cx="132" cy="104" r="15" fill="#2a6fb0"/>
    <circle cx="228" cy="104" r="15" fill="#2a6fb0"/>
    <circle cx="112" cy="150" r="11" fill="#5aa0d8"/>
    <circle cx="180" cy="150" r="11" fill="#5aa0d8"/>
    <circle cx="248" cy="150" r="11" fill="#5aa0d8"/>
  </g>
  <circle cx="180" cy="180" r="160" fill="none" stroke="#0f4c81" stroke-width="8"/>

</svg>
